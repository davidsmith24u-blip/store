<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Clock - Multi Timezone</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            width: 100%;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .controls {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .control-group {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .control-group label {
            color: white;
            font-weight: 500;
        }

        select, button {
            padding: 10px 15px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            background: white;
            color: #333;
            font-weight: 500;
        }

        select:hover, button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        button {
            background: #ff6b6b;
            color: white;
        }

        button:hover {
            background: #ff5252;
        }

        .clocks-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .clock-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .clock-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
        }

        .timezone-name {
            text-align: center;
            font-size: 1.3rem;
            font-weight: 600;
            color: #667eea;
            margin-bottom: 15px;
        }

        .digital-display {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 15px;
            border: 2px solid #667eea;
        }

        .time-display {
            font-family: 'Courier New', monospace;
            font-size: 2.5rem;
            font-weight: bold;
            color: #00ff00;
            text-align: center;
            text-shadow: 0 0 10px #00ff00;
            letter-spacing: 2px;
        }

        .date-display {
            font-family: 'Courier New', monospace;
            font-size: 0.9rem;
            color: #00ff00;
            text-align: center;
            margin-top: 10px;
            opacity: 0.8;
        }

        .clock-details {
            display: flex;
            justify-content: space-around;
            gap: 10px;
        }

        .detail {
            flex: 1;
            text-align: center;
            background: #f0f0f0;
            padding: 10px;
            border-radius: 8px;
        }

        .detail-label {
            font-size: 0.8rem;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .detail-value {
            font-size: 1.1rem;
            font-weight: 600;
            color: #667eea;
            margin-top: 5px;
        }

        .add-timezone-section {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            text-align: center;
        }

        .add-timezone-section h2 {
            color: #667eea;
            margin-bottom: 20px;
        }

        .timezone-input-group {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 15px;
        }

        input[type="text"] {
            padding: 10px 15px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
            flex: 1;
            min-width: 200px;
            max-width: 300px;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 5px rgba(102, 126, 234, 0.3);
        }

        .timezone-suggestions {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 10px;
            margin-top: 15px;
        }

        .suggestion-btn {
            padding: 8px 12px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }

        .suggestion-btn:hover {
            background: #764ba2;
            transform: translateY(-2px);
        }

        .info-message {
            background: #e8f4f8;
            border-left: 4px solid #667eea;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            color: #333;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 1.8rem;
            }

            .time-display {
                font-size: 1.8rem;
            }

            .clocks-grid {
                grid-template-columns: 1fr;
            }

            .controls {
                flex-direction: column;
            }

            .control-group {
                width: 100%;
                justify-content: space-between;
            }

            select {
                flex: 1;
            }
        }

        .remove-btn {
            width: 100%;
            background: #ff6b6b;
            color: white;
            padding: 8px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            margin-top: 10px;
            transition: all 0.3s ease;
        }

        .remove-btn:hover {
            background: #ff5252;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🕐 Digital Clock</h1>
            <p>Real-time clock display across multiple time zones</p>
        </div>

        <div class="controls">
            <div class="control-group">
                <label for="formatToggle">Format:</label>
                <button id="formatToggle">Switch to 24h</button>
            </div>
        </div>

        <div class="info-message">
            ℹ️ All clocks update in real-time. Add custom timezones below or use the quick suggestions.
        </div>

        <div class="clocks-grid" id="clocksGrid">
            <!-- Clock cards will be generated here -->
        </div>

        <div class="add-timezone-section">
            <h2>Add Custom Timezone</h2>
            <div class="timezone-input-group">
                <input 
                    type="text" 
                    id="timezoneInput" 
                    placeholder="e.g., America/New_York, Asia/Tokyo"
                    autocomplete="off"
                >
                <button onclick="addCustomTimezone()">Add Timezone</button>
            </div>
            <div id="suggestions" class="timezone-suggestions"></div>
        </div>
    </div>

    <script>
        // List of common timezones
        const commonTimezones = [
            'UTC',
            'America/New_York',
            'America/Chicago',
            'America/Denver',
            'America/Los_Angeles',
            'Europe/London',
            'Europe/Paris',
            'Europe/Berlin',
            'Asia/Tokyo',
            'Asia/Shanghai',
            'Asia/Hong_Kong',
            'Asia/Singapore',
            'Asia/Dubai',
            'Asia/Kolkata',
            'Australia/Sydney',
            'Australia/Melbourne',
            'Pacific/Auckland',
            'America/Toronto',
            'America/Mexico_City',
            'America/Sao_Paulo',
            'Africa/Cairo',
            'Africa/Johannesburg',
        ];

        let selectedTimezones = ['UTC', 'America/New_York', 'Europe/London', 'Asia/Tokyo'];
        let is24HourFormat = false;

        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            loadTimezones();
            updateAllClocks();
            setInterval(updateAllClocks, 1000);
            setupSuggestions();
            setupTimezoneInput();
        });

        function loadTimezones() {
            const stored = localStorage.getItem('selectedTimezones');
            if (stored) {
                selectedTimezones = JSON.parse(stored);
            }
            renderClocks();
        }

        function saveTimezones() {
            localStorage.setItem('selectedTimezones', JSON.stringify(selectedTimezones));
        }

        function renderClocks() {
            const grid = document.getElementById('clocksGrid');
            grid.innerHTML = '';

            selectedTimezones.forEach((tz, index) => {
                const card = document.createElement('div');
                card.className = 'clock-card';
                card.id = `clock-${index}`;
                card.innerHTML = `
                    <div class="timezone-name">${getTimezoneName(tz)}</div>
                    <div class="digital-display">
                        <div class="time-display" data-timezone="${tz}">--:--:--</div>
                        <div class="date-display" data-timezone-date="${tz}">Loading...</div>
                    </div>
                    <div class="clock-details">
                        <div class="detail">
                            <div class="detail-label">UTC Offset</div>
                            <div class="detail-value" data-offset="${tz}">+0:00</div>
                        </div>
                        <div class="detail">
                            <div class="detail-label">Day of Week</div>
                            <div class="detail-value" data-dayofweek="${tz}">---</div>
                        </div>
                        <div class="detail">
                            <div class="detail-label">Week</div>
                            <div class="detail-value" data-weeknumber="${tz}">--</div>
                        </div>
                    </div>
                    ${selectedTimezones.length > 1 ? `
                        <button class="remove-btn" onclick="removeTimezone('${tz}')">Remove</button>
                    ` : ''}
                `;
                grid.appendChild(card);
            });
        }

        function updateAllClocks() {
            selectedTimezones.forEach((tz) => {
                updateClock(tz);
            });
        }

        function updateClock(timezone) {
            try {
                const now = new Date();
                const formatter = new Intl.DateTimeFormat('en-US', {
                    timeZone: timezone,
                    hour12: !is24HourFormat,
                    hour: '2-digit',
                    minute: '2-digit',
                    second: '2-digit',
                });

                const dateFormatter = new Intl.DateTimeFormat('en-US', {
                    timeZone: timezone,
                    weekday: 'long',
                    year: 'numeric',
                    month: 'long',
                    day: 'numeric',
                });

                const offsetFormatter = new Intl.DateTimeFormat('en-US', {
                    timeZone: timezone,
                    year: 'numeric',
                    month: '2-digit',
                    day: '2-digit',
                    hour: '2-digit',
                    minute: '2-digit',
                    second: '2-digit',
                    hour12: false,
                });

                const parts = formatter.formatToParts(now);
                let timeString = '';
                parts.forEach(part => {
                    if (part.type !== 'literal') {
                        timeString += part.value;
                    } else {
                        timeString += part.value;
                    }
                });

                const dateString = dateFormatter.format(now);

                // Calculate offset
                const tzDate = new Date(now.toLocaleString('en-US', { timeZone: timezone }));
                const offset = (now - tzDate) / 60000; // in minutes
                const hours = Math.floor(offset / 60);
                const mins = offset % 60;
                const offsetString = `${hours >= 0 ? '+' : '-'}${String(Math.abs(hours)).padStart(2, '0')}:${String(Math.abs(mins)).padStart(2, '0')}`;

                // Get day of week
                const dayOfWeek = new Intl.DateTimeFormat('en-US', {
                    timeZone: timezone,
                    weekday: 'short'
                }).format(now);

                // Calculate week number
                const weekNumber = getWeekNumber(tzDate);

                // Update DOM
                const timeEl = document.querySelector(`[data-timezone="${timezone}"]`);
                const dateEl = document.querySelector(`[data-timezone-date="${timezone}"]`);
                const offsetEl = document.querySelector(`[data-offset="${timezone}"]`);
                const dayEl = document.querySelector(`[data-dayofweek="${timezone}"]`);
                const weekEl = document.querySelector(`[data-weeknumber="${timezone}"]`);

                if (timeEl) timeEl.textContent = timeString;
                if (dateEl) dateEl.textContent = dateString;
                if (offsetEl) offsetEl.textContent = offsetString;
                if (dayEl) dayEl.textContent = dayOfWeek;
                if (weekEl) weekEl.textContent = `W${weekNumber}`;
            } catch (e) {
                console.error(`Error updating clock for ${timezone}:`, e);
            }
        }

        function getWeekNumber(date) {
            const firstDayOfYear = new Date(date.getFullYear(), 0, 1);
            const pastDaysOfYear = (date - firstDayOfYear) / 86400000;
            return Math.ceil((pastDaysOfYear + firstDayOfYear.getDay() + 1) / 7);
        }

        function getTimezoneName(tz) {
            if (tz === 'UTC') return '🌍 UTC / GMT';
            const parts = tz.split('/');
            return `🕐 ${parts[parts.length - 1].replace(/_/g, ' ')}`;
        }

        function addCustomTimezone() {
            const input = document.getElementById('timezoneInput');
            const tz = input.value.trim();

            if (!tz) {
                alert('Please enter a timezone');
                return;
            }

            // Validate timezone
            try {
                new Intl.DateTimeFormat('en-US', { timeZone: tz });
            } catch (e) {
                alert(`Invalid timezone: ${tz}`);
                return;
            }

            if (selectedTimezones.includes(tz)) {
                alert('This timezone is already added');
                return;
            }

            selectedTimezones.push(tz);
            saveTimezones();
            renderClocks();
            updateAllClocks();
            input.value = '';
        }

        function removeTimezone(tz) {
            selectedTimezones = selectedTimezones.filter(t => t !== tz);
            saveTimezones();
            renderClocks();
            updateAllClocks();
        }

        function setupSuggestions() {
            const container = document.getElementById('suggestions');
            container.innerHTML = '';
            commonTimezones.forEach(tz => {
                if (!selectedTimezones.includes(tz)) {
                    const btn = document.createElement('button');
                    btn.className = 'suggestion-btn';
                    btn.textContent = getTimezoneName(tz).replace('🕐 ', '').replace('🌍 ', '');
                    btn.onclick = () => {
                        selectedTimezones.push(tz);
                        saveTimezones();
                        renderClocks();
                        updateAllClocks();
                        setupSuggestions();
                    };
                    container.appendChild(btn);
                }
            });
        }

        function setupTimezoneInput() {
            const input = document.getElementById('timezoneInput');
            input.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    addCustomTimezone();
                }
            });
        }

        document.getElementById('formatToggle').addEventListener('click', function() {
            is24HourFormat = !is24HourFormat;
            this.textContent = `Switch to ${is24HourFormat ? '12h' : '24h'}`;
            updateAllClocks();
        });
    </script>
</body>
</html>
